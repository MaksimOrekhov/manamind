name: ManaEngine experimental

on:
  push:
    branches: ["**"]
    paths:
      - "experiments/manaengine/**"
      - "reports/manaengine_phase4_20261003/**"
      - "reports/manaengine_phase4b_20261004/**"
      - "data/cards/**"
      - "src/manamind/cards/**"
      - "src/manamind/domain/**"
      - "src/manamind/encoding/**"
      - "src/manamind/integrations/manaengine/**"
      - "src/manamind/integrations/rosettastone/policy.py"
      - "tests/test_pipeline.py"
      - "tests/test_policy_action_semantics.py"
      - "train_selfplay.py"
      - ".github/workflows/manaengine-experimental.yml"
  pull_request:
    paths:
      - "experiments/manaengine/**"
      - "reports/manaengine_phase4_20261003/**"
      - "reports/manaengine_phase4b_20261004/**"
      - "data/cards/**"
      - "src/manamind/cards/**"
      - "src/manamind/domain/**"
      - "src/manamind/encoding/**"
      - "src/manamind/integrations/manaengine/**"
      - "src/manamind/integrations/rosettastone/policy.py"
      - "tests/test_pipeline.py"
      - "tests/test_policy_action_semantics.py"
      - "train_selfplay.py"
      - ".github/workflows/manaengine-experimental.yml"
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.os }} / ManaEngine
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and adapter dependencies
        run: python -m pip install --upgrade -e ".[dev]" cmake ninja pybind11
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Configure Windows with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S experiments/manaengine -B build/manaengine -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=cl
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -S experiments/manaengine -B build/manaengine -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
      - name: Release build
        run: cmake --build build/manaengine --config Release --parallel 2
      - name: CTest
        run: ctest --test-dir build/manaengine -C Release --output-on-failure
      - name: Python adapter and policy schema tests
        shell: bash
        env:
          PYTHONPATH: src
          MANAMIND_MANAENGINE_BUILD: ${{ github.workspace }}/build/manaengine/python
        run: python -m pytest -q -p no:cacheprovider experiments/manaengine/tests/test_adapter.py experiments/manaengine/tests/test_simulation_attempt.py tests/test_pipeline.py tests/test_policy_action_semantics.py tests/test_simulation_attempt_contract.py
