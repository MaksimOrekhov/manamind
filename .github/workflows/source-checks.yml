name: Source and generated artifact checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,replays]"
      - name: Python correctness diagnostics
        run: python -m ruff check src tests scripts
      - name: Native typed failure inventory and source guard
        run: python reports/manaengine_unknown_state_architecture/phase_4k1b_failure_site_audit.py check
      - name: Pinned Standard catalog reproduces offline
        run: python scripts/check_generated_artifacts.py
      - run: git diff --exit-code
      - run: python -m pytest -q
